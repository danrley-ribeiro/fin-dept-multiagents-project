# Protocolos de interação (modelo de interação). Cada protocolo é uma FSM:
# transições válidas viram testes nominais e as inválidas viram testes negativos (DSM2).
# Mensagem: m = <s, r, p, c, o, k>  (remetente, destinatário, performativo, conteúdo, ontologia, conversation_id)
items:
  - id: PROT-SOL
    titulo: Solicitação do usuário (FIPA-Request externo)
    proposito: Receber um pedido da liderança e devolver resultado ou falha explícita.
    participantes: [ROLE-SOL, ROLE-ORQ]
    meio: Interface (ENV-UI)
    performativos: [request, agree, not-understood, refuse, inform, failure]
    estado_inicial: RECEBIDA
    estados_finais: [CONCLUIDA, FALHOU, RECUSADA]
    transicoes:
      - [RECEBIDA, not-understood, RECUSADA]
      - [RECEBIDA, refuse, RECUSADA]
      - [RECEBIDA, agree, EM_EXECUCAO]
      - [EM_EXECUCAO, inform, CONCLUIDA]
      - [EM_EXECUCAO, failure, FALHOU]
    invalidas:
      - [RECEBIDA, inform, "resultado antes de aceitar a solicitação"]
      - [CONCLUIDA, inform, "segundo resultado para a mesma conversa"]
    # DSM3: quem pode emitir cada performativo (papel do remetente) e o esquema do conteúdo.
    emissores:
      request: [ROLE-SOL]
      agree: [ROLE-ORQ]
      not-understood: [ROLE-ORQ]
      refuse: [ROLE-ORQ]
      inform: [ROLE-ORQ]
      failure: [ROLE-ORQ]
    esquemas:
      request: {intencao: str, entidade: str, competencia: aaaa-mm}
      not-understood: {motivo: str}
      refuse: {motivo: str}
      inform: {intencao: str, status: str, relatorio: str, ressalvas: list, resultado: dict}
      failure: {motivo: str, publicado: bool}
    entrega: DSM1

  - id: PROT-DEL
    titulo: Delegação de subtarefa (FIPA-Request via A2A)
    proposito: Orquestrador atribui uma subtarefa do DAG a um papel especialista com prazo reply_by.
    participantes: [ROLE-ORQ, ROLE-CUS, ROLE-ORC, ROLE-RES, ROLE-CIN, ROLE-REL]
    meio: SVC-A2A
    performativos: [request, agree, refuse, inform, failure]
    estado_inicial: CRIADA
    estados_finais: [CONCLUIDA, FALHOU, RECUSADA, EXPIRADA]
    transicoes:
      - [CRIADA, request, AGUARDANDO]
      - [AGUARDANDO, agree, EM_EXECUCAO]
      - [AGUARDANDO, refuse, RECUSADA]
      - [AGUARDANDO, timeout, EXPIRADA]
      - [EM_EXECUCAO, inform, CONCLUIDA]
      - [EM_EXECUCAO, failure, FALHOU]
      - [EM_EXECUCAO, timeout, EXPIRADA]
    invalidas:
      - [AGUARDANDO, inform, "resultado antes de agree"]
      - [EXPIRADA, inform, "resposta após reply_by é descartada"]
    emissores:
      request: [ROLE-ORQ]
      agree: [ROLE-CUS, ROLE-ORC, ROLE-RES, ROLE-CIN, ROLE-REL]
      refuse: [ROLE-CUS, ROLE-ORC, ROLE-RES, ROLE-CIN, ROLE-REL]
      inform: [ROLE-CUS, ROLE-ORC, ROLE-RES, ROLE-CIN, ROLE-REL]
      failure: [ROLE-CUS, ROLE-ORC, ROLE-RES, ROLE-CIN, ROLE-REL]
    esquemas:
      request: {tarefa: str, entidade: str, competencia: aaaa-mm}
      refuse: {motivo: str}
      inform: {}
      failure: {motivo: str}
    entrega: DSM1

  - id: PROT-QRY
    titulo: Consulta entre especialistas (FIPA-Query-Ref via A2A)
    proposito: >-
      Um especialista obtém informação de outro sem acessar suas regras internas: o Agente de Resultados
      consulta Custos e Orçamento; o Agente de Orçamento consulta Controles Internos para explicar um
      desvio (decisão do próprio agente, sem o Orquestrador).
    participantes: [ROLE-RES, ROLE-CUS, ROLE-ORC, ROLE-CIN]
    meio: SVC-A2A
    performativos: [query-ref, inform, refuse, failure]
    estado_inicial: CRIADA
    estados_finais: [RESPONDIDA, RECUSADA, FALHOU, EXPIRADA]
    transicoes:
      - [CRIADA, query-ref, AGUARDANDO]
      - [AGUARDANDO, inform, RESPONDIDA]
      - [AGUARDANDO, refuse, RECUSADA]
      - [AGUARDANDO, failure, FALHOU]
      - [AGUARDANDO, timeout, EXPIRADA]
    invalidas:
      - [CRIADA, inform, "inform não solicitado (conversation_id desconhecido)"]
    emissores:
      query-ref: [ROLE-RES, ROLE-ORC]
      inform: [ROLE-CUS, ROLE-ORC, ROLE-CIN]
      refuse: [ROLE-CUS, ROLE-ORC, ROLE-CIN]
      failure: [ROLE-CUS, ROLE-ORC, ROLE-CIN]
    esquemas:
      query-ref: {assunto: str}
      inform: {proveniencia: dict}
      refuse: {motivo: str}
      failure: {motivo: str}
    entrega: DSM1

  - id: PROT-CMP
    titulo: Verificação de conformidade com veto
    proposito: O Agente de Controles Internos avalia o pacote do fechamento e pode bloquear a publicação.
    participantes: [ROLE-ORQ, ROLE-CIN]
    meio: SVC-A2A
    performativos: [request, conforme, nao_conforme_nao_critico, veto, correcao, waiver_humano, prazo_esgotado, publicar]
    estado_inicial: CRIADA
    estados_finais: [LIBERADO, BLOQUEADO]
    transicoes:
      - [CRIADA, request, EM_ANALISE]
      - [EM_ANALISE, conforme, LIBERADO]
      - [EM_ANALISE, nao_conforme_nao_critico, LIBERADO_COM_RESSALVA]
      - [EM_ANALISE, veto, VETADO]
      - [LIBERADO_COM_RESSALVA, publicar, LIBERADO]
      - [VETADO, correcao, EM_ANALISE]
      - [VETADO, waiver_humano, LIBERADO_COM_RESSALVA]
      - [VETADO, prazo_esgotado, BLOQUEADO]
    invalidas:
      - [VETADO, publicar, "publicar resultado vetado sem waiver ou correção"]
    emissores:
      request: [ROLE-ORQ]
      conforme: [ROLE-CIN]
      nao_conforme_nao_critico: [ROLE-CIN]
      veto: [ROLE-CIN]
      correcao: [ROLE-ORQ]
      waiver_humano: [ROLE-ORQ]
      prazo_esgotado: [ROLE-ORQ]
    eventos_locais:
      publicar: [ROLE-ORQ]
    esquemas:
      request: {tarefa: str, entidade: str, competencia: aaaa-mm}
      conforme: {achados: list}
      nao_conforme_nao_critico: {achados: list}
      veto: {achados: list, opcoes: list, correcoes_sugeridas: list}
      correcao: {aprovacao: str, correcoes: list}
      waiver_humano: {aprovacao: str, justificativa: str}
      prazo_esgotado: {decisao: str}
    entrega: DSM1

  - id: PROT-LCK
    titulo: Reserva de período contábil
    proposito: Garantir exclusão mútua de um fechamento por (entidade, competência).
    participantes: [ROLE-ORQ, SVC-LCK]
    meio: Chamada local ao serviço
    performativos: [reserve, reserve-accept, reserve-failure, release]
    estado_inicial: LIVRE
    estados_finais: [LIVRE]
    transicoes:
      - [LIVRE, reserve, RESERVADO]
      - [RESERVADO, reserve_outro_dono, RESERVADO]
      - [RESERVADO, release, LIVRE]
      - [RESERVADO, ttl_expirado, LIVRE]
    invalidas:
      - [RESERVADO, reserve_outro_dono_aceito, "segunda reserva sobreposta aceita"]
      - [LIVRE, release, "liberar reserva inexistente"]
    entrega: DSM1

  - id: PROT-APR
    titulo: Approval Gate (human-in-the-loop)
    proposito: >-
      Reter ações restritas (waiver de veto, correção no ERP) até decisão humana explícita, vinculada à
      solicitação, ao veto (hash dos achados), à identidade do aprovador e a um prazo; cada aprovação é de uso único.
    participantes: [ROLE-ORQ, ROLE-APR, SVC-POL]
    meio: SVC-A2A + SVC-POL
    performativos: [propose-action, approve, reject]
    estado_inicial: CRIADA
    estados_finais: [EXECUTADA, NEGADA, REJEITADA, EXPIRADA]
    transicoes:
      - [CRIADA, propose-action, PROPOSTA]
      - [PROPOSTA, allow, EXECUTADA]
      - [PROPOSTA, deny, NEGADA]
      - [PROPOSTA, require_approval, PENDENTE]
      - [PENDENTE, approve, APROVADA]
      - [PENDENTE, reject, REJEITADA]
      - [PENDENTE, timeout, EXPIRADA]
      - [APROVADA, execute, EXECUTADA]
      - [APROVADA, timeout, EXPIRADA]  # aprovada mas não executada no prazo (ex.: approve perdido em trânsito)
    invalidas:
      - [PENDENTE, execute, "execução sem aprovação humana"]
      - [NEGADA, approve, "ação DENY não admite aprovação"]
      - [APROVADA, approve, "aprovação duplicada"]
      - [EXECUTADA, approve, "aprovação reutilizada após a execução"]
      - [EXPIRADA, approve, "aprovação após o prazo é descartada"]
    emissores:
      propose-action: [ROLE-ORQ]
      approve: [ROLE-APR]
      reject: [ROLE-APR]
    eventos_locais:
      allow: [SVC-POL]
      deny: [SVC-POL]
      require_approval: [SVC-POL]
      execute: [ROLE-ORQ]
    esquemas:
      propose-action: {solicitacao: str, competencia: aaaa-mm, acao: str, veto: str, achados: list, opcoes: list,
                       correcoes_sugeridas: list, prazo: int}
      approve: {aprovacao: str, solicitacao: str, veto: str, decisao: str, justificativa: str, correcoes: "list?"}
      reject: {aprovacao: str, solicitacao: str, veto: str, justificativa: str}
    entrega: DSM3
