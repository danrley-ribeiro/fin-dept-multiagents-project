name: Rastreabilidade, documentação e PDF

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Dependências
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          pip install -r docs/requirements.txt

      - name: Validar cadeia de rastreabilidade
        run: python tools/trace.py --check

      - name: Arquivos gerados estão atualizados no commit
        run: |
          python tools/trace.py
          git diff --exit-code -- docs/_generated entregas/dsm1/modelos-editaveis \
            || (echo "::error::Rode 'make trace' e faça commit dos arquivos gerados." && exit 1)

      - name: Documentação (sphinx -W)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - uses: actions/upload-artifact@v4
        with:
          name: documentacao-html
          path: docs/_build/html

  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependências (pytest, pyyaml, openpyxl, textual, anthropic)
        run: pip install -r requirements-dev.txt
      - name: Testes unitários e e2e (offline)
        run: python -m pytest
      - name: Validar cadeia de rastreabilidade
        run: python tools/trace.py --check
      - name: Catálogo de cenários (duas execuções por cenário, hashes iguais)
        run: PYTHONPATH=src python -m fin_mas cenarios --verificar

  interface:
    runs-on: ubuntu-latest
    env:
      PW_CHANNEL: chromium  # no runner não há o Chrome do sistema: usa o Chromium baixado pelo Playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependências Python (o servidor real sobe nos testes de uso)
        run: pip install -r requirements-dev.txt
      - uses: oven-sh/setup-bun@v2
      - name: Dependências do dashboard
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Chromium do Playwright
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Testes unitários do dashboard (vitest)
        working-directory: web
        run: bun run test
      - name: Testes de uso no navegador (Playwright + servidor Python)
        working-directory: web
        run: PYTHON="$(command -v python)" bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: web/test-results

  pdf:
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - uses: actions/checkout@v4
      - name: Compilar PDF da DSM1
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: entregas/dsm1/documentacao
      - uses: actions/upload-artifact@v4
        with:
          name: dsm1-pdf
          path: entregas/dsm1/documentacao/main.pdf
