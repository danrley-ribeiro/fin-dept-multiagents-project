[project]
name = "fin-mas"
version = "0.2.0"
description = "Protótipo (DSM2) do sistema multiagente de controladoria"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
markers = [
    "e2e: cenário ponta a ponta dos agentes sobre o bus",
]
