name: Rastreabilidade, documentação e PDF

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Dependências
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          pip install -r docs/requirements.txt

      - name: Validar cadeia de rastreabilidade
        run: python tools/trace.py --check

      - name: Arquivos gerados estão atualizados no commit
        run: |
          python tools/trace.py
          git diff --exit-code -- docs/_generated entregas/dsm1/generated diagrams/dsm1 \
            || (echo "::error::Rode 'make trace' e faça commit dos arquivos gerados." && exit 1)

      - name: Documentação (sphinx -W)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - uses: actions/upload-artifact@v4
        with:
          name: documentacao-html
          path: docs/_build/html

  pdf:
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - uses: actions/checkout@v4
      - name: Compilar PDF da DSM1
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: entregas/dsm1
      - uses: actions/upload-artifact@v4
        with:
          name: dsm1-pdf
          path: entregas/dsm1/main.pdf
