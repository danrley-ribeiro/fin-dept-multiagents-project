# Requisitos (template AOSE: ID, tipo, descrição, papel, evidência observável de aceite).
# Links de saída: objetivos (satisfies), problemas (addresses), papeis (assigned_to),
# protocolos (uses_protocol), normas (constrained_by). Testes e métricas apontam para cá.
items:
  # ---------------- Funcionais ----------------
  - id: REQ-F01
    tipo: Funcional
    titulo: Decomposição e agregação de solicitações
    descricao: >-
      O Orquestrador deve mapear cada solicitação do catálogo ("fechar o resultado
      do mês", "avaliar o orçamento do trimestre") para um DAG de subtarefas,
      delegá-las aos papéis competentes e agregar uma resposta final; pedido fora
      do catálogo recebe not-understood explícito. Se um especialista expirar ou
      falhar, a subtarefa é reenviada uma vez; na segunda falha, a solicitação
      termina em failure, com a reserva liberada e nada publicado.
    evidencia: >-
      Trace com o DAG gerado e, por subtarefa, request → agree → inform/failure
      sob o mesmo conversation_id; resposta final com status explícito.
    objetivos: [G-01]
    problemas: [PROB-01]
    papeis: [ROLE-ORQ, ROLE-SOL]
    protocolos: [PROT-SOL, PROT-DEL]
    normas: []
    prioridade: Must
    entrega: DSM1

  - id: REQ-F02
    tipo: Funcional
    titulo: Apuração de custos, margem e rentabilidade
    descricao: >-
      Apurar custos fixos e variáveis, aplicar rateio por critério configurado e
      calcular margem de contribuição e rentabilidade por produto, serviço e UN a
      partir do balancete obtido via MCP.
    evidencia: >-
      Valores idênticos ao gabarito do dataset sintético (tolerância R$ 0,01) e
      cada valor acompanhado de proveniência (fonte MCP, consulta, versão do rateio).
    objetivos: [G-02]
    problemas: [PROB-02]
    papeis: [ROLE-CUS]
    protocolos: [PROT-DEL]
    normas: []
    prioridade: Must
    entrega: DSM1

  - id: REQ-F03
    tipo: Funcional
    titulo: Orçado x realizado e forecast
    descricao: >-
      Comparar orçado x realizado por conta e centro de custo, sinalizar desvios
      acima de limiar configurável (percentual e absoluto) e projetar o forecast
      do trimestre com método declarado.
    evidencia: >-
      Desvios sinalizados exatamente nos itens plantados acima do limiar do
      cenário de teste; forecast reproduzível com o mesmo seed.
    objetivos: [G-03]
    problemas: [PROB-03]
    papeis: [ROLE-ORC]
    protocolos: [PROT-DEL, PROT-QRY]
    normas: []
    prioridade: Must
    entrega: DSM1

  - id: REQ-F04
    tipo: Funcional
    titulo: Resultado consolidado via A2A
    descricao: >-
      Montar DRE gerencial, EBITDA, fluxo de caixa (método indireto) e KPIs,
      obtendo custos e orçamento dos agentes especialistas por query-ref A2A, sem
      reimplementar suas regras.
    evidencia: >-
      Trace mostra query-ref AG-RES→AG-CUS e AG-RES→AG-ORC antes do inform final; DRE igual ao
      gabarito; inform não solicitado é rejeitado.
    objetivos: [G-04]
    problemas: [PROB-01]
    papeis: [ROLE-RES, ROLE-CUS, ROLE-ORC]
    protocolos: [PROT-QRY, PROT-DEL]
    normas: []
    prioridade: Must
    entrega: DSM1

  - id: REQ-F05
    tipo: Funcional
    titulo: Controles internos com veto
    descricao: >-
      Verificar alçada, segregação de funções, duplicidade, conciliação pendente e
      competência sobre o pacote do fechamento, emitindo parecer com regra violada
      e severidade; não conformidade crítica veta a publicação.
    evidencia: >-
      Todas as inconformidades críticas plantadas detectadas; publicação em estado
      VETADO é bloqueada até correção ou waiver humano.
    objetivos: [G-05]
    problemas: [PROB-04]
    papeis: [ROLE-CIN, ROLE-ORQ]
    protocolos: [PROT-CMP]
    normas: [NORM-04]
    prioridade: Must
    entrega: DSM1

  - id: REQ-F06
    tipo: Funcional
    titulo: Relatório executivo por template com LLM opcional
    descricao: >-
      Gerar relatório executivo por template determinístico a partir dos
      resultados consolidados; com a flag LLM ativa, acrescentar narrativa e
      insights preservando os números do núcleo.
    evidencia: >-
      Com flag desligada o relatório é gerado sem rede; com flag ligada todo
      número do texto coincide com o núcleo ou o template é usado.
    objetivos: [G-06]
    problemas: [PROB-05]
    papeis: [ROLE-REL]
    protocolos: [PROT-DEL]
    normas: [NORM-05, NORM-07]
    prioridade: Must
    entrega: DSM1

  - id: REQ-F07
    tipo: Funcional
    titulo: Memória de longo prazo com proveniência
    descricao: >-
      Toda saída aprovada pelo controller vira memória (embedding + nós e arestas
      de conta, indicador, decisão e período); os agentes consultam a memória
      antes de nova análise e citam a proveniência usada.
    evidencia: >-
      Saída não aprovada não aparece na memória; análise seguinte cita o ID da
      memória e a fonte original.
    objetivos: [G-08]
    problemas: [PROB-07]
    papeis: [ROLE-CUS, ROLE-ORC, ROLE-RES, ROLE-REL]
    protocolos: [PROT-APR]
    normas: [NORM-08]
    prioridade: Should
    entrega: DSM1

  # ---------------- Segurança ----------------
  - id: REQ-S01
    tipo: Segurança
    titulo: Ações com efeito externo só com aprovação
    descricao: >-
      Lançar ajuste no ERP, alterar orçamento ou publicar relatório nunca é
      executado autonomamente: a Política de Segurança classifica em ALLOW,
      REQUIRE_APPROVAL ou DENY e retém a ação no Approval Gate.
    evidencia: >-
      ActionRequest em PENDENTE até approve humano; ação DENY nunca executa
      efeito colateral, mesmo com aprovação.
    objetivos: [G-09]
    problemas: [PROB-08]
    papeis: [ROLE-ORQ, ROLE-REL, ROLE-ORC, ROLE-APR]
    protocolos: [PROT-APR]
    normas: [NORM-01, NORM-02, NORM-10]
    prioridade: Must
    entrega: DSM1

  - id: REQ-S04
    tipo: Segurança
    titulo: Autenticidade e integridade das interações (feedback da DSM2)
    descricao: >-
      O barramento valida remetente (identidade registrada e credencial), destinatário (contraparte da
      conversa), papel (quem pode emitir cada performativo e aplicar cada transição local), conversação,
      performativo e esquema do conteúdo antes de mudar qualquer estado; o conteúdo é protegido contra
      alteração após o envio; erros de um agente não interrompem a simulação; decisões humanas só valem
      vinculadas ao ticket, ao veto e ao aprovador.
    evidencia: >-
      Decisão forjada de remetente inexistente, aprovação sem credencial, transição local por identificador
      não autorizado, resposta a quem não participa da conversa, pedido sem campos obrigatórios e reutilização
      de aprovação são rejeitados e auditados; o cenário ataque_decisao_forjada termina bloqueado, sem publicar.
    objetivos: [G-09, G-05]
    problemas: [PROB-08, PROB-04]
    papeis: [ROLE-ORQ, ROLE-APR, ROLE-CIN, ROLE-SOL]
    protocolos: [PROT-SOL, PROT-DEL, PROT-QRY, PROT-CMP, PROT-APR]
    normas: [NORM-09, NORM-10]
    prioridade: Must
    entrega: DSM3

  - id: REQ-S02
    tipo: Segurança
    titulo: Exclusão mútua do período em fechamento
    descricao: >-
      Dois fechamentos concorrentes da mesma entidade e competência são impedidos
      por reserva exclusiva com TTL; o conflito retorna falha explicada.
    evidencia: >-
      Segunda reserva sobreposta recebe reserve-failure com o dono atual; reserva
      expirada é liberada.
    objetivos: [G-01, G-05]
    problemas: [PROB-01, PROB-04]
    papeis: [ROLE-ORQ]
    protocolos: [PROT-LCK]
    normas: [NORM-03]
    prioridade: Must
    entrega: DSM1

  - id: REQ-S03
    tipo: Segurança
    titulo: LLM não calcula nem autoriza
    descricao: >-
      Todo número presente em texto gerado por LLM é validado contra o núcleo
      determinístico; divergência descarta o texto e aciona o template. Proposta
      de ação vinda de LLM nunca é tratada como autorização.
    evidencia: >-
      Mock de LLM que altera um valor provoca fallback registrado em log; mock que
      sugere ação não gera execução.
    objetivos: [G-06, G-09]
    problemas: [PROB-05, PROB-06]
    papeis: [ROLE-REL, ROLE-RES, ROLE-ORC]
    protocolos: [PROT-APR]
    normas: [NORM-05]
    prioridade: Must
    entrega: DSM1

  # ---------------- Observabilidade ----------------
  - id: REQ-O01
    tipo: Observabilidade
    titulo: Log de decisão
    descricao: >-
      Cada decisão registra critério/regra, referências dos dados de entrada,
      agente, conversation_id e timestamp em JSONL append-only, via interceptor
      central (não por agente).
    evidencia: >-
      Script reconstrói a sequência causal de uma solicitação a partir do
      conversation_id sem inspecionar o código.
    objetivos: [G-07]
    problemas: [PROB-06]
    papeis: [ROLE-ORQ, ROLE-CUS, ROLE-ORC, ROLE-RES, ROLE-CIN, ROLE-REL]
    protocolos: [PROT-DEL]
    normas: [NORM-06]
    prioridade: Must
    entrega: DSM1

  - id: REQ-O02
    tipo: Observabilidade
    titulo: Log de prompt
    descricao: >-
      Quando a flag LLM estiver ativa, registrar o prompt exato (após redaction),
      versão do template, modelo e fontes anexadas.
    evidencia: >-
      Com flag ligada há um registro de prompt por chamada; com flag desligada
      nenhum registro de prompt é criado.
    objetivos: [G-07]
    problemas: [PROB-06]
    papeis: [ROLE-REL, ROLE-RES, ROLE-ORC]
    protocolos: []
    normas: [NORM-06, NORM-07]
    prioridade: Must
    entrega: DSM1

  - id: REQ-O03
    tipo: Observabilidade
    titulo: Log de custo e tokens
    descricao: >-
      Registrar tokens de entrada e saída, modelo e custo estimado por chamada,
      agregados por tarefa, solicitação e agente.
    evidencia: >-
      Soma dos custos por chamada igual ao total da tarefa; custo zero com flag
      desligada.
    objetivos: [G-07]
    problemas: [PROB-06]
    papeis: [ROLE-REL, ROLE-RES, ROLE-ORC]
    protocolos: []
    normas: [NORM-07]
    prioridade: Must
    entrega: DSM1

  - id: REQ-O04
    tipo: Observabilidade
    titulo: Interface de observabilidade segura
    descricao: >-
      Dashboard web autenticado, com filtros por agente, período, tarefa e custo sobre os logs de
      auditoria. Especificado na DSM1 e implementado na DSM3: login por pessoa, permissões por papel,
      aba de logs com exportação, explicação de decisões e sequência das conversas. Mobile e desktop
      nativos ficam fora do escopo (o dashboard web é responsivo).
    evidencia: >-
      Cada filtro retorna exatamente os registros do recorte em base de teste;
      acesso sem autenticação é negado.
    objetivos: [G-07]
    problemas: [PROB-06]
    papeis: [ROLE-APR, ROLE-SOL, ROLE-OPE, ROLE-AUD]
    protocolos: []
    normas: [NORM-06, NORM-12]
    prioridade: Could
    entrega: DSM1

  # ---------------- Configuração ----------------
  - id: REQ-C01
    tipo: Configuração
    titulo: Modelo por agente trocável sem redeploy
    descricao: >-
      Registro central define por agente a flag LLM (padrão desligada), modelo,
      limite de tokens e orçamento; a mudança vale na próxima tarefa sem redeploy;
      LLM só é habilitável em AG-REL, AG-RES e AG-ORC; cota excedida bloqueia a chamada e
      aciona o template.
    evidencia: >-
      Troca de modelo refletida na tarefa seguinte; configuração com LLM em AG-ORQ,
      AG-CUS ou AG-CIN é rejeitada; cota estourada gera fallback registrado.
    objetivos: [G-07, G-09]
    problemas: [PROB-06]
    papeis: [ROLE-REL, ROLE-RES, ROLE-ORC, ROLE-APR]
    protocolos: []
    normas: [NORM-07]
    prioridade: Must
    entrega: DSM1

  # ---------------- Privacidade ----------------
  - id: REQ-P01
    tipo: Privacidade
    titulo: Redaction fail-closed (LGPD e sigilo)
    descricao: >-
      Logs, traces e memória passam por redaction de segredos, credenciais e
      dados pessoais, com política de retenção; falha de sanitização impede a
      gravação.
    evidencia: >-
      Registro com chave de API ou CPF sintético é sanitizado ou recusado; nenhum
      campo proibido aparece nos arquivos JSONL.
    objetivos: [G-07]
    problemas: [PROB-06]
    papeis: [ROLE-ORQ, ROLE-CIN, ROLE-REL]
    protocolos: []
    normas: [NORM-06]
    prioridade: Must
    entrega: DSM1

  # ---------------- Não funcionais ----------------
  - id: REQ-NF01
    tipo: Não funcional
    titulo: Execução offline e reprodutível
    descricao: >-
      O núcleo executa sem rede e sem API paga, com MCP mocks, dados sintéticos e
      seed fixo; o LLM é estritamente opcional.
    evidencia: >-
      Duas execuções com o mesmo seed e flag desligada produzem saídas com o mesmo
      hash.
    objetivos: [G-07]
    problemas: [PROB-06]
    papeis: [ROLE-ORQ, ROLE-REL]
    protocolos: [PROT-DEL]
    normas: [NORM-07]
    prioridade: Must
    entrega: DSM1

  - id: REQ-NF02
    tipo: Não funcional
    titulo: Versionamento de prompts, regras e configuração
    descricao: >-
      Templates de prompt, regras de conformidade e configurações de modelo têm
      ID e versão, registrados em cada log de decisão e de prompt.
    evidencia: >-
      Todo registro de log contém as versões vigentes; mudança de versão aparece
      no trace seguinte.
    objetivos: [G-07]
    problemas: [PROB-06]
    papeis: [ROLE-REL, ROLE-CIN]
    protocolos: []
    normas: [NORM-07]
    prioridade: Should
    entrega: DSM1

  # ---------------- DSM3: identidade de pessoas e cognição assistida ----------------
  - id: REQ-S05
    tipo: Segurança
    titulo: Identidade, sessão e autorização por pessoa
    descricao: >-
      Quem usa a plataforma é uma pessoa com conta: entra com senha, recebe uma sessão com prazo, só executa o
      que os papéis dela permitem (negado por padrão) e tem cada comando e cada decisão registrados no seu nome.
      A decisão no Approval Gate vale pela pessoa autenticada (atestado de sessão), confere o cargo e a
      segregação de funções contra a pessoa real, e quem fez a solicitação não decide sobre ela.
    evidencia: >-
      Sem sessão a API responde 401; sem a permissão, 403 com a regra; decisão sem atestado, com atestado
      forjado, de sessão revogada, repetido, de cargo sem alçada, de pessoa envolvida ou do próprio solicitante
      é rejeitada e auditada; sessão revogada deixa de valer na requisição seguinte; cadastro adulterado não
      deixa ninguém entrar.
    objetivos: [G-07, G-09]
    problemas: [PROB-06, PROB-08]
    papeis: [ROLE-ADM, ROLE-APR, ROLE-OPE, ROLE-AUD, ROLE-SOL]
    protocolos: [PROT-APR]
    normas: [NORM-10, NORM-12, NORM-13]
    prioridade: Must
    entrega: DSM3

  - id: REQ-F08
    tipo: Funcional
    titulo: Cognição assistida por hipóteses verificáveis (local e LLM opcional)
    descricao: >-
      O agente cognitivo recebe propostas de hipótese de regras locais (offline) e, se a flag estiver ligada,
      de um LLM. Cada proposta é validada por regras; a aceita vira hipótese, separada das crenças, e gera uma
      ação epistêmica (buscar a evidência, negociando prazo se preciso). Só a evidência de fonte determinística
      revisa a crença e muda a avaliação.
    evidencia: >-
      Com cognição local, a hipótese leva a uma segunda consulta e o desvio passa a bater com o gabarito;
      propostas inválidas (número, alvo, tipo, ação, evidência inexistente) são rejeitadas e o resultado é
      idêntico ao do nível básico; nenhuma crença tem um proponente como fonte; no nível básico o trace é o mesmo.
    objetivos: [G-03, G-07]
    problemas: [PROB-03, PROB-06]
    papeis: [ROLE-ORC]
    protocolos: [PROT-QRY, PROT-DEL]
    normas: [NORM-05, NORM-07, NORM-11]
    prioridade: Should
    entrega: DSM3

  # ---- DSM4 (ADR-011): conectores e entendimento automático de fontes ----
  - id: REQ-F20
    tipo: Funcional
    titulo: Fonte de dados por conector genérico e entendimento automático sem IA generativa
    descricao: >-
      A empresa liga a SMA à própria fonte sem conector de fornecedor: ERP simulado, pasta de planilhas (várias
      competências), API REST JSON qualquer (contrato OpenAPI ou amostras) ou servidor MCP por stdio. O
      entendimento da fonte é determinístico (nomes, sinônimos pt/en, tipos e conteúdo): estrutura, sugestão de
      mapeamento para o modelo canônico com confiança e motivo, relatório de qualidade e prévia redigida. LLM
      só sugere, se ligado, e passa pela mesma validação; o mapeamento só vale confirmado por uma pessoa.
    evidencia: >-
      Fechamento sobre o ERP de demonstração em loopback igual ao do ERP simulado na mesma seed; planilha fora do
      modelo e tools MCP entendidas com o gabarito de mapeamento e o mesmo fechamento da leitura canônica; fonte
      fora do ar termina em falha explícita, sem travar; sugestão inválida do LLM rejeitada com o motivo.
    objetivos: [G-01, G-07]
    problemas: [PROB-01, PROB-06]
    papeis: [ROLE-OPE, ROLE-ORQ]
    protocolos: [PROT-DEL]
    normas: [NORM-02, NORM-20, NORM-21]
    prioridade: Should
    entrega: DSM4

  - id: REQ-S20
    tipo: Segurança
    titulo: Credencial de conector selada e rede só em loopback salvo liberação do administrador
    descricao: >-
      A credencial de um conector vai para o cofre selado e nunca volta pela API, pelo trace nem pela trilha; só é
      enviada ao host a que foi vinculada no cadastro. Host fora do loopback exige liberação explícita de uma pessoa
      com PERM-DAD-REDE; redirecionamentos não são seguidos. A escrita na fonte (correção) continua só com o ticket
      aprovado no Approval Gate.
    evidencia: >-
      O token não aparece em resposta, trace, trilha nem no arquivo do cofre; host externo negado sem liberação e o
      operador não consegue liberar; trocar a URL desvincula a credencial; correção sem aprovação não chega ao ERP.
    objetivos: [G-07, G-09]
    problemas: [PROB-06, PROB-08]
    papeis: [ROLE-ADM, ROLE-OPE]
    protocolos: [PROT-APR]
    normas: [NORM-06, NORM-12, NORM-22]
    prioridade: Must
    entrega: DSM4
