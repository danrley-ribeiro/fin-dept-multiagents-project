# Normas organizacionais: escopo, condição e consequência; realizadas por serviços.
# decisao: ALLOW | REQUIRE_APPROVAL | DENY | OBRIGACAO
items:
  - id: NORM-01
    titulo: Efeito externo exige aprovação humana
    escopo: Lançar ajuste no ERP, alterar orçamento, publicar relatório à diretoria
    condicao: Qualquer papel propõe ação com efeito fora do sistema
    consequencia: Ação retida no Approval Gate até approve; timeout expira sem executar
    decisao: REQUIRE_APPROVAL
    imposta_por: [SVC-POL]
    entrega: DSM1

  - id: NORM-02
    titulo: Fora da allowlist do papel é negado
    escopo: Toda tool MCP e ação de escrita
    condicao: Ação não consta da allowlist do papel solicitante
    consequencia: Bloqueio fail-closed, sem opção de aprovação, registrado em log
    decisao: DENY
    imposta_por: [SVC-POL, SVC-MCP]
    entrega: DSM1

  - id: NORM-03
    titulo: Período em fechamento é exclusivo
    escopo: Par (entidade, competência)
    condicao: Já existe reserva ativa de outro dono
    consequencia: reserve-failure explicado; reserva expira por TTL
    decisao: DENY
    imposta_por: [SVC-LCK]
    entrega: DSM1

  - id: NORM-04
    titulo: Não conformidade crítica bloqueia publicação
    escopo: Resultado do período e relatório executivo
    condicao: Parecer do Agente de Controles Internos com severidade crítica
    consequencia: Publicação vetada até correção reavaliada ou waiver humano justificado
    decisao: DENY
    imposta_por: [SVC-POL]
    entrega: DSM1

  - id: NORM-05
    titulo: LLM não calcula números nem autoriza ações
    escopo: Toda saída de LLM (AG-REL, AG-RES, AG-ORC)
    condicao: Texto gerado contém número divergente do núcleo determinístico ou propõe ação
    consequencia: Texto descartado e substituído pelo template; proposta tratada como não autorizada
    decisao: DENY
    imposta_por: [SVC-MOD, SVC-POL]
    entrega: DSM1

  - id: NORM-06
    titulo: Logs e memória sem segredos nem dados pessoais desnecessários
    escopo: Traces JSONL, logs de prompt, memória de longo prazo
    condicao: Conteúdo contém credencial, token, chave ou dado pessoal fora da finalidade
    consequencia: Redaction; se a sanitização falhar, a gravação é recusada (fail-closed)
    decisao: OBRIGACAO
    imposta_por: [SVC-AUD, SVC-MEM]
    entrega: DSM1

  - id: NORM-07
    titulo: LLM só por flag, só em papéis permitidos, dentro da cota
    escopo: Configuração de modelos por agente
    condicao: Flag desligada, papel não permitido (AG-ORQ, AG-CUS, AG-CIN) ou cota de tokens esgotada
    consequencia: Chamada LLM bloqueada e agente segue em modo determinístico (template)
    decisao: DENY
    imposta_por: [SVC-MOD]
    entrega: DSM1

  - id: NORM-08
    titulo: Somente saída aprovada vira memória
    escopo: Serviço de Memória (SVC-MEM)
    condicao: Saída sem aprovação humana registrada
    consequencia: Não é indexada em embeddings nem no grafo
    decisao: DENY
    imposta_por: [SVC-MEM]
    entrega: DSM1

  - id: NORM-09
    titulo: Só mensagem autêntica, do papel certo e bem formada muda o estado de uma conversa
    escopo: Toda mensagem A2A e toda transição local de FSM (SVC-A2A)
    condicao: >-
      Remetente não registrado ou sem credencial, papel sem permissão para o performativo ou evento,
      destinatário fora da conversa, esquema inválido ou transição fora da FSM
    consequencia: Mensagem ou transição rejeitada e registrada (`rejected`); nenhum estado muda; a simulação segue
    decisao: DENY
    imposta_por: [SVC-A2A]
    entrega: DSM3

  - id: NORM-10
    titulo: Decisão humana vinculada, com política explícita e de uso único
    escopo: Liberação de veto (waiver) e correção no ERP (Approval Gate, SVC-POL)
    condicao: >-
      Decisão sem ticket do SVC-POL, de outro aprovador, com hash de veto diferente, fora do prazo, fora das
      opções abertas, sem justificativa, por pessoa envolvida no lançamento, reutilizada ou repetida após waiver
      anterior do mesmo padrão
    consequencia: Decisão rejeitada no barramento; o veto continua valendo; sem decisão válida no prazo, bloqueio
    decisao: DENY
    imposta_por: [SVC-POL]
    entrega: DSM3
