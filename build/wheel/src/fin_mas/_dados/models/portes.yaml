# Base normativa por porte de empresa (versão normas-v2). Fonte única das regras usadas pelos agentes:
# os limites, severidades, materialidade, fonte primária do realizado e pesos dos desejos BDI de
# AG-ORC e AG-CIN vêm daqui, lidos pela tool MCP `normas.perfil` (não ficam no código dos agentes).
#
# Valores monetários em centavos. "null" em alçada = sem limite (sócio ou diretor estatutário).
#
# Referências (resumo; ver docs/dsm2/portes.md):
#   - LC 123/2006, art. 3º: ME com receita bruta anual até R$ 360 mil; EPP até R$ 4,8 milhões.
#   - BNDES (classificação de porte por receita operacional bruta): média até R$ 300 milhões; grande acima.
#   - Lei 11.638/2007, art. 3º: sociedade de grande porte (ativo > R$ 240 mi ou receita > R$ 300 mi)
#     tem escrituração pela Lei 6.404/76 e auditoria independente obrigatória.
#   - CFC: ITG 1000 (modelo contábil simplificado para ME/EPP), NBC TG 1000 (PMEs), CPCs completos.
#   - NBC TA 320: materialidade proporcional ao porte; usada para os limiares absolutos de desvio.
#   - COSO 2013: sem pessoas para segregar funções, aceita-se controle compensatório (revisão do sócio).
#
# Ficha do porte (DSM3): os campos regime_tributario, obrigacoes, estrutura, volume, calendario_fechamento,
# politica_aprovacao, papeis_de_acesso, fonte_de_dados e cognicao_padrao descrevem como uma empresa daquele
# porte costuma operar e como o sistema é implantado nela. São referência para o assistente de instalação e
# para a aba "Porte" do dashboard; não são lidos pelos agentes e não mudam nenhuma regra (a versão das normas
# continua normas-v2). Regimes e obrigações estão resumidos: cada empresa confirma os seus com a contabilidade.
#   - LC 123/2006: Simples Nacional para ME e EPP (opção, com vedações).
#   - Lei 9.718/1998, arts. 13 e 14: Lucro Presumido até R$ 78 milhões de receita no ano anterior; acima, Lucro Real.
#
# Portes novos (DSM4), acrescentados sem mudar nenhum valor dos quatro acima nem a versão das normas
# (a versão entra no trace; os cenários revisados continuam com o mesmo hash). Fontes conferidas em 12/11/2026:
#   - MEI: LC 123/2006, art. 18-A, § 1º (redação da LC 188/2021): receita bruta no ano-calendário anterior
#     de até R$ 81.000,00; art. 18-C: um único empregado. https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp123.htm
#     A LC 238/2026 (https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp238.htm) eleva o limite para
#     R$ 110.000,00 no ano-calendário de 2027 (art. 2º) e R$ 140.000,00 com efeitos a partir de 1º/1/2028
#     (art. 10, I), condicionado à lei orçamentária (art. 3º), e admite até 2 empregados a partir de
#     1º/1/2027 (art. 10, II). A competência simulada é 2026-09: vale R$ 81 mil.
#   - Média empresa I e II: página "Porte de empresa" do BNDES
#     (https://www.bndes.gov.br/wps/portal/site/home/financiamento/guia/porte-de-empresa): Média Empresa I
#     de mais de R$ 4,8 milhões a R$ 90 milhões; Média Empresa II de mais de R$ 90 milhões a R$ 300 milhões
#     de receita operacional bruta anual. O porte `media` continua com o teto legal da média (R$ 300 milhões)
#     e, na classificação por receita, cede a faixa de R$ 90 a 300 milhões à subdivisão `media_ii`
#     (campo `subdivide`).
#   - O MEI é enquadramento por opção (SIMEI), não só faixa de receita: `porte_por_receita` só devolve `mei`
#     quando a empresa é optante (campo `exige_opcao`). Uma ME com receita abaixo de R$ 81 mil continua ME.
#   - Escalas, alçadas, materialidade, pesos BDI e ciclos de correção dos portes novos são PARÂMETROS DA
#     SIMULAÇÃO (como nos quatro portes de antes), não números de lei.
versao: normas-v2
portes:
  mei:
    dupla_aprovacao: null                               # POL-12 (DSM4): uma pessoa só; não se aplica
    titulo: Microempreendedor individual (MEI)
    receita_bruta_anual_max: 8100000           # R$ 81 mil (LC 123/2006, art. 18-A, § 1º; LC 188/2021)
    exige_opcao: SIMEI                          # enquadramento por opção: porte_por_receita(..., mei=True)
    norma_contabil: sem escrituração contábil completa; controle de receitas e despesas do titular
    tem_erp: false                              # caderno ou planilha: usa os modelos Excel
    fonte_primaria: planilha
    escala: 0.02                                # parâmetro: receita anual simulada sempre abaixo de R$ 81 mil
    escala_orcamento: 0.05
    escala_lancamentos: 0.05
    pessoas: {elisa: titular}                   # uma pessoa só: quem lança é quem aprova
    aprovadores: [titular]
    limites_alcada: {titular: null}             # o titular responde por tudo; não há a quem delegar
    severidade: {alcada: critica, sod: nao_critica, duplicidade: critica, competencia: nao_critica}
    controle_compensatorio:
      sod: sem segunda pessoa a segregação é impossível; revisão mensal dos extratos e das notas pelo titular, conferida pelo contador (controle compensatório, COSO 2013)
    limiar_desvio: {percentual: 20, absoluto: 20000}    # R$ 200
    pesos_cin: {conformidade: 10, prazo: 9}             # o titular não pode parar o negócio para fechar o mês
    pesos_orc: {precisao: 1, tempestividade: 2}
    max_ciclos_correcao: 2
    regime_tributario: SIMEI (recolhimento mensal em valor fixo, dentro do Simples Nacional)
    obrigacoes: [recolhimento mensal do DAS-MEI, declaração anual do MEI (DASN-SIMEI), relatório mensal das receitas brutas (a confirmar com a contabilidade)]
    estrutura: {pessoas: 1, descricao: o titular faz tudo; no máximo um empregado (art. 18-C); contador externo opcional}
    volume: {lancamentos_mes: poucas dezenas, contas_orcamento: 5, centros_de_custo: 1}
    calendario_fechamento: fechamento simples até o dia 20, antes do vencimento do DAS
    politica_aprovacao: o titular decide tudo; a segregação de funções é substituída por controle compensatório registrado
    papeis_de_acesso: {titular: [ROLE-SOL, ROLE-APR], administrador_de_acesso: o próprio titular em outra conta ou o contador}
    fonte_de_dados: planilha modelo (dados/modelos), enviada pelo dashboard a cada competência
    cognicao_padrao: local

  micro:
    titulo: Microempresa (ME)
    receita_bruta_anual_max: 36000000          # R$ 360 mil (LC 123/2006, art. 3º, I)
    norma_contabil: ITG 1000 (modelo contábil simplificado)
    tem_erp: false                              # controle em planilhas: usa os modelos Excel
    fonte_primaria: planilha
    escala: 0.09                                # receita e custos fixos sobre a base sintética (pior caso na faixa)
    escala_orcamento: 0.09                      # linhas de despesa orçadas por conta
    escala_lancamentos: 0.2
    pessoas: {ana: assistente, elisa: socio}
    aprovadores: [socio]
    limites_alcada: {assistente: 200000, socio: null}   # assistente até R$ 2 mil; sócio sem limite
    dupla_aprovacao: null                               # POL-12 (DSM4): uma pessoa só decide; não se aplica
    severidade: {alcada: critica, sod: nao_critica, duplicidade: critica, competencia: nao_critica}
    controle_compensatorio:
      sod: revisão mensal dos lançamentos pelo sócio (controle compensatório, COSO 2013)
    limiar_desvio: {percentual: 15, absoluto: 50000}    # R$ 500
    pesos_cin: {conformidade: 10, prazo: 8}             # dono pequeno: travar o mês custa caro
    pesos_orc: {precisao: 2, tempestividade: 2}
    max_ciclos_correcao: 2
    regime_tributario: Simples Nacional (opção da LC 123/2006) ou Lucro Presumido
    obrigacoes: [apuração mensal do Simples (PGDAS-D), declaração anual (DEFIS), livro caixa ou escrituração simplificada (ITG 1000)]
    estrutura: {pessoas: 2, descricao: sócio que decide e um assistente que lança; contabilidade externa}
    volume: {lancamentos_mes: dezenas, contas_orcamento: 5, centros_de_custo: 1 a 3}
    calendario_fechamento: fechamento até o dia 10 do mês seguinte, numa única etapa
    politica_aprovacao: o sócio aprova tudo; quem pede também decide, sob controle compensatório (revisão mensal registrada)
    papeis_de_acesso: {socio: [ROLE-SOL, ROLE-APR], assistente: [ROLE-SOL, ROLE-OPE], administrador_de_acesso: contador externo ou o próprio sócio em outra conta}
    fonte_de_dados: planilha modelo (dados/modelos), enviada pelo dashboard a cada competência
    cognicao_padrao: local

  pequena:
    titulo: Empresa de Pequeno Porte (EPP)
    receita_bruta_anual_max: 480000000         # R$ 4,8 milhões (LC 123/2006, art. 3º, II)
    norma_contabil: NBC TG 1000 (contabilidade para PMEs)
    tem_erp: true                               # sistema de gestão simples
    fonte_primaria: ERP
    escala: 1.0
    escala_orcamento: 1.0
    escala_lancamentos: 0.3
    pessoas: {ana: analista, bruno: analista, carla: gerente, elisa: diretor}
    aprovadores: [gerente, diretor]
    limites_alcada: {analista: 300000, gerente: 1500000, diretor: null}
    dupla_aprovacao: null                               # POL-12 (DSM4): quatro pessoas, sem quatro olhos
    severidade: {alcada: critica, sod: critica, duplicidade: critica, competencia: nao_critica}
    controle_compensatorio: {}
    limiar_desvio: {percentual: 12, absoluto: 200000}   # R$ 2 mil
    pesos_cin: {conformidade: 10, prazo: 6}
    pesos_orc: {precisao: 3, tempestividade: 2}
    max_ciclos_correcao: 1
    regime_tributario: Simples Nacional (até o limite de R$ 4,8 milhões) ou Lucro Presumido
    obrigacoes: [apuração mensal do Simples (PGDAS-D) ou do Lucro Presumido, declaração anual, escrituração pela NBC TG 1000]
    estrutura: {pessoas: 4, descricao: diretor, um gerente e dois analistas; financeiro e contábil na mesma equipe}
    volume: {lancamentos_mes: centenas, contas_orcamento: 5, centros_de_custo: 3}
    calendario_fechamento: fechamento até o dia 8, com conferência do gerente antes da publicação
    politica_aprovacao: gerente ou diretor aprovam; quem criou ou aprovou o lançamento vetado não decide sobre ele
    papeis_de_acesso: {diretor: [ROLE-SOL, ROLE-APR], gerente: [ROLE-APR], analista: [ROLE-SOL], operacao: [ROLE-OPE]}
    fonte_de_dados: sistema de gestão simples (ERP) como fonte primária; planilha para o orçamento
    cognicao_padrao: local

  media:
    titulo: Média empresa
    receita_bruta_anual_max: 30000000000       # R$ 300 milhões (BNDES)
    norma_contabil: NBC TG 1000 ou CPCs completos
    tem_erp: true
    fonte_primaria: ERP
    escala: 12.5
    escala_orcamento: 3.0
    escala_lancamentos: 1.0
    pessoas: {ana: analista, bruno: analista, carla: gerente, diego: gerente, elisa: diretor}
    aprovadores: [gerente, diretor]
    limites_alcada: {analista: 1000000, gerente: 5000000, diretor: 20000000}
    dupla_aprovacao: 5000000                            # POL-12 (DSM4): acima de R$ 50 mil, duas pessoas
    severidade: {alcada: critica, sod: critica, duplicidade: critica, competencia: nao_critica}
    controle_compensatorio: {}
    limiar_desvio: {percentual: 10, absoluto: 500000}   # R$ 5 mil
    pesos_cin: {conformidade: 10, prazo: 5}
    pesos_orc: {precisao: 3, tempestividade: 1}
    max_ciclos_correcao: 1
    regime_tributario: Lucro Presumido (até R$ 78 milhões de receita no ano anterior) ou Lucro Real
    obrigacoes: [escrituração contábil e fiscal digitais (ECD, ECF), apurações mensais e trimestrais, demonstrações pela NBC TG 1000 ou pelos CPCs]
    estrutura: {pessoas: 5, descricao: diretor, dois gerentes e dois analistas; controladoria separada do financeiro}
    volume: {lancamentos_mes: milhares, contas_orcamento: 5, centros_de_custo: 3}
    calendario_fechamento: fechamento até o dia 5 útil, com parecer de controles internos antes do relatório à diretoria
    politica_aprovacao: gerente até a alçada dele, diretor acima; segregação de funções obrigatória
    papeis_de_acesso: {diretor: [ROLE-SOL, ROLE-APR], gerente: [ROLE-APR], analista: [ROLE-SOL], operacao: [ROLE-OPE], auditoria: [ROLE-AUD], ti: [ROLE-ADM]}
    fonte_de_dados: ERP como fonte primária; planilha de orçamento reconciliada com o ERP
    cognicao_padrao: local

  media_ii:
    dupla_aprovacao: 5000000                            # POL-12 (DSM4): acima de R$ 50 mil, duas pessoas
    titulo: Média empresa II (BNDES)
    subdivide: media                            # faixa de cima da média: R$ 90 a 300 milhões (BNDES)
    receita_bruta_anual_min: 9000000000         # mais de R$ 90 milhões (BNDES, Média Empresa II)
    receita_bruta_anual_max: 30000000000        # até R$ 300 milhões (BNDES)
    norma_contabil: CPCs completos (recomendado; obrigatório só para sociedade de grande porte, Lei 11.638/2007)
    tem_erp: true
    fonte_primaria: ERP
    escala: 105.0                               # parâmetro: receita anual simulada entre R$ 90 e 300 milhões
    escala_orcamento: 8.0
    escala_lancamentos: 1.5
    pessoas: {ana: analista, bruno: analista, carla: gerente, diego: gerente, elisa: diretor}
    aprovadores: [gerente, diretor]
    limites_alcada: {analista: 1500000, gerente: 7500000, diretor: 30000000}
    severidade: {alcada: critica, sod: critica, duplicidade: critica, competencia: nao_critica}
    controle_compensatorio: {}
    limiar_desvio: {percentual: 7, absoluto: 2000000}   # R$ 20 mil
    pesos_cin: {conformidade: 10, prazo: 4}
    pesos_orc: {precisao: 4, tempestividade: 1}
    max_ciclos_correcao: 1
    regime_tributario: Lucro Real (receita acima do teto de R$ 78 milhões do Lucro Presumido)
    obrigacoes: [escrituração contábil e fiscal digitais (ECD, ECF), apurações do Lucro Real, demonstrações pelos CPCs, auditoria independente quando exigida por credores ou pelo contrato social]
    estrutura: {pessoas: 5 ou mais, descricao: diretor, gerentes por área e analistas; controladoria e controles internos separados do financeiro}
    volume: {lancamentos_mes: milhares a dezenas de milhares, contas_orcamento: 5, centros_de_custo: 3 ou mais}
    calendario_fechamento: fechamento até o dia 4 útil, com parecer de controles internos e revisão da controladoria
    politica_aprovacao: alçadas por valor em três níveis; segregação de funções obrigatória
    papeis_de_acesso: {diretor: [ROLE-SOL, ROLE-APR], gerente: [ROLE-APR], analista: [ROLE-SOL], operacao: [ROLE-OPE], auditoria: [ROLE-AUD], ti: [ROLE-ADM]}
    fonte_de_dados: ERP como fonte primária; integrações por conector
    cognicao_padrao: local

  grande:
    titulo: Grande empresa (sociedade de grande porte)
    receita_bruta_anual_max: null              # acima de R$ 300 milhões
    norma_contabil: CPCs completos (Lei 6.404/76) e auditoria independente (Lei 11.638/2007)
    tem_erp: true
    fonte_primaria: ERP
    escala: 800.0
    escala_orcamento: 20.0
    escala_lancamentos: 2.0
    pessoas: {ana: analista, bruno: analista, carla: gerente, diego: gerente, elisa: diretor}
    aprovadores: [gerente, diretor]
    limites_alcada: {analista: 2000000, gerente: 10000000, diretor: 50000000}
    dupla_aprovacao: 2500000                            # POL-12 (DSM4): acima de R$ 25 mil, duas pessoas
    severidade: {alcada: critica, sod: critica, duplicidade: critica, competencia: critica}  # corte material
    controle_compensatorio: {}
    limiar_desvio: {percentual: 5, absoluto: 5000000}   # R$ 50 mil
    pesos_cin: {conformidade: 10, prazo: 3}
    pesos_orc: {precisao: 4, tempestividade: 1}
    max_ciclos_correcao: 1
    regime_tributario: Lucro Real
    obrigacoes: [escrituração contábil e fiscal digitais (ECD, ECF), demonstrações pela Lei 6.404/76 e pelos CPCs completos, auditoria independente (Lei 11.638/2007)]
    estrutura: {pessoas: 5 ou mais, descricao: diretoria estatutária, gerências por área, analistas; auditoria interna e comitê}
    volume: {lancamentos_mes: dezenas de milhares, contas_orcamento: 5, centros_de_custo: 3 ou mais}
    calendario_fechamento: fechamento até o dia 3 útil, com corte de competência rígido e revisão de auditoria
    politica_aprovacao: alçadas por valor em três níveis; nenhuma pessoa decide sozinha acima da própria alçada
    papeis_de_acesso: {diretor: [ROLE-SOL, ROLE-APR], gerente: [ROLE-APR], analista: [ROLE-SOL], operacao: [ROLE-OPE], auditoria: [ROLE-AUD], seguranca_da_informacao: [ROLE-ADM]}
    fonte_de_dados: ERP corporativo como fonte primária; integrações por conector (DSM4)
    cognicao_padrao: local
